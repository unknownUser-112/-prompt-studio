/* ==========================================================
   V500.6.3 VISUAL UX UPDATE
   Clearer hierarchy, larger touch targets and responsive wizard
   ========================================================== */
:root{
  --surface-1:#102027;
  --surface-2:#0b181e;
  --surface-3:#091419;
  --soft-line:#ffffff18;
  --focus-ring:0 0 0 3px #8ec8ff2e;
}
#app{width:min(1320px,100%)}
.top{padding-inline:clamp(16px,3.2vw,42px)}
.brand>div:last-child{min-width:0}
.brand b{font-size:15px;line-height:1.25}
.brand small{font-size:12px;letter-spacing:.055em;text-transform:none}
.tools button{min-width:76px}
.progress{padding-inline:clamp(16px,3.2vw,42px)}
.dots{
  gap:9px;padding:0 clamp(16px,3.2vw,42px) 18px;
  scroll-snap-type:x proximity;
}
.dot{
  flex:1 1 0;min-width:74px;max-width:128px;height:auto;min-height:48px;
  padding:7px 9px;border-radius:14px;display:grid;grid-template-columns:28px minmax(0,1fr);
  align-items:center;gap:7px;text-align:left;scroll-snap-align:center;
}
.dot-number{
  width:28px;height:28px;border-radius:9px;display:grid;place-items:center;
  background:#ffffff0b;border:1px solid var(--soft-line);font-size:12px;
}
.dot-label{min-width:0;font-size:11px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot.active{box-shadow:var(--focus-ring)}
.dot.active .dot-number{background:var(--blue);border-color:var(--blue);color:#07151d}
.dot.done .dot-number{background:#09201722;border-color:#09201744}
main{padding-inline:clamp(12px,2.4vw,32px)}
.card{border-radius:26px;box-shadow:0 24px 60px #0004}
.content{padding:clamp(24px,4vw,48px);scrollbar-gutter:stable}
h1{max-width:820px}
.lead{max-width:760px;font-size:15px}
.form{gap:16px}
.ui-group,.feature-engine,details,.engine-dashboard{
  border-color:var(--soft-line);box-shadow:none;
}
.ui-group{padding:18px;background:linear-gradient(180deg,#0d1d23,#0a171c)}
.ui-group-title{margin-bottom:14px}
.ui-group-title b{font-size:15px}
.ui-group-title small,.v5-field-help,.v5-choice small,.feature-summary,.feature-head small{font-size:13px;line-height:1.45}
summary{min-height:60px;padding:14px 16px}
summary b{font-size:14px}
summary small{font-size:13px;line-height:1.35;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.drop{padding:12px 14px 14px}
.opt{min-height:50px;padding:11px 13px;font-size:15px;border-color:#ffffff16}
.opt.selected{box-shadow:inset 3px 0 0 var(--ac)}
.feature-chip,.v5-category-tab{min-height:46px;font-size:14px;padding:9px 13px}
.feature-card{padding:16px;border-color:var(--soft-line)}
.feature-control{font-size:13px}
.feature-control select,.input-label input{min-height:48px;font-size:15px}
.input-label{font-size:14px}
.ui-note,.note,.quality,.conflict-strip,.app-message{font-size:13px;line-height:1.5}
.engine-dashboard{background:#0a171c;padding:0;overflow:hidden}
.engine-dashboard>summary{min-height:56px;background:#ffffff04}
.engine-dashboard-body{padding:16px}
.engine-status small{font-size:12px;line-height:1.4}
.foot{position:sticky;bottom:0;z-index:6;backdrop-filter:blur(18px);background:#132128ee}
.foot button{min-height:48px;padding-inline:18px}

const REGISTRY_FOUNDATION_VERSION='V500.6.1-registry-foundation';
const REGISTRY_TEST_FRAMEWORK_VERSION='V500.6.1-unified-test-framework';
const AUTOMATIC_MODULE_TEST_VERSION='V500.6.1-automatic-module-tests';

const REGISTRY_TEST_CATEGORIES=Object.freeze({
 module:'Module & Optionen',prompt:'Prompt & Sprache',adapter:'Modelladapter',
 data:'Datenmodell',migration:'Migration',version:'Version',ui:'UI',
 performance:'Performance',security:'Sicherheit',diagnostics:'Diagnose'
});
function createRegistry(registryName,{validate}={}){
 const entries=new Map();
 const normalizeId=id=>String(id||'').trim();
 return Object.freeze({
  name:registryName,
  register(definition,{replace=false}={}){
   if(!definition||typeof definition!=='object'||Array.isArray(definition))throw new TypeError(`${registryName}: Definition muss ein Objekt sein.`);
   const id=normalizeId(definition.id);
   if(!id)throw new Error(`${registryName}: Eine stabile id ist erforderlich.`);
   if(entries.has(id)&&!replace)throw new Error(`${registryName}: Doppelte id "${id}".`);
   const normalized=Object.freeze({...definition,id});
   if(typeof validate==='function'){
    const issues=validate(normalized);
    if(Array.isArray(issues)&&issues.length)throw new Error(`${registryName}/${id}: ${issues.join(' ')}`);
   }
   entries.set(id,normalized);return normalized;
  },
  get(id){return entries.get(normalizeId(id))||null;},
  has(id){return entries.has(normalizeId(id));},
  list(){return Array.from(entries.values());},
  ids(){return Array.from(entries.keys());},
  size(){return entries.size;},
  validate(){
   const issues=[];
   for(const entry of entries.values()){
    if(!entry.id)issues.push('Eintrag ohne id.');
    if(typeof validate==='function')for(const issue of validate(entry)||[])issues.push(`${entry.id}: ${issue}`);
   }
   return {ok:issues.length===0,registry:registryName,count:entries.size,issues};
  }
 });
}
function validateModuleDefinition(x){

 if(x.lifecycle&&!REGISTRY_LIFECYCLES.includes(x.lifecycle))issues.push('Ungültiger lifecycle.');
 if(x.stateKey!==undefined&&!String(x.stateKey).trim())issues.push('stateKey ist leer.');
 return issues;
}
function validateOptionDefinition(x){
 const issues=[];
 if(!x.moduleId)issues.push('moduleId fehlt.');
 if(x.value===undefined||x.value===null||String(x.value)==='')issues.push('value fehlt.');
 if(!x.labelDe)issues.push('labelDe fehlt.');
 return issues;
}
function validateAdapterDefinition(x){

}
function validateTestDefinition(x){

 if(!['error','warn','info'].includes(x.severity||'error'))issues.push('Ungültige severity.');

}

function registryToken(value){

  .replace(/ß/g,'ss').replace(/[^a-zA-Z0-9]+(.)?/g,(_,c)=>c?c.toUpperCase():'')

}
function registerOption(moduleId,definition){

}
function registerTest(definition){return TEST_REGISTRY.register({severity:'error',lifecycle:'active',...definition});}

// V500.3.2 STEP 4.1 + 4.2: UNIFIED REGISTRY TEST FRAMEWORK
// Eine zentrale Pipeline erzeugt und startet stabile Registry-Tests.

function createRegistryTestContext(overrides={}){
 let currentState=null,promptData=null;
 try{currentState=typeof createInitialData==='function'?createInitialData():null;}catch(_){currentState=null;}
 try{promptData=currentState&&typeof buildPromptData==='function'?buildPromptData(currentState):null;}catch(_){promptData=null;}
 return Object.freeze({
  state:currentState,promptData,
  moduleRegistry:MODULE_REGISTRY,optionRegistry:OPTION_REGISTRY,
  adapterRegistry:ADAPTER_REGISTRY,engineRegistry:ENGINE_REGISTRY,
  testRegistry:TEST_REGISTRY,...overrides
 });
}
function registryTestResult(definition,ok,error='',details=''){
 return {
  id:definition.id,title:definition.title,name:definition.title,
  ok:Boolean(ok),severity:definition.severity||'error',
  engineId:definition.engineId||'diagnostics',
  engine:ENGINE_REGISTRY.get(definition.engineId)?.label||definition.engineId||'Diagnostic Engine',
  category:definition.category||'diagnostics',
  lifecycle:definition.lifecycle||'active',
  moduleId:definition.moduleId||null,

}
function generateAutomaticModuleTests(){
 const tests=[];
 for(const module of MODULE_REGISTRY.list()){
  const prefix=`module.${module.id}`;
  const common={moduleId:module.id,category:'module',engineId:'modulePipeline',severity:'error',lifecycle:module.lifecycle||'active'};
  tests.push(
   {...common,id:`${prefix}.definition`,title:`${module.labelDe||module.id}: Moduldefinition vollständig`,run:()=>Boolean(module.id&&module.labelDe&&module.type)},
   {...common,id:`${prefix}.state-key`,title:`${module.labelDe||module.id}: gültiger State-Key`,run:()=>typeof module.stateKey==='string'&&module.stateKey.trim().length>0},
   {...common,id:`${prefix}.lifecycle`,title:`${module.labelDe||module.id}: gültiger Lebenszyklus`,run:()=>REGISTRY_LIFECYCLES.includes(module.lifecycle||'active')},
   {...common,id:`${prefix}.prompt-section`,title:`${module.labelDe||module.id}: Promptbereich definiert`,run:()=>typeof module.promptSection==='string'&&module.promptSection.trim().length>0},
   {...common,id:`${prefix}.options-present`,title:`${module.labelDe||module.id}: Optionen registriert`,run:ctx=>ctx.optionRegistry.list().some(option=>option.moduleId===module.id)},
   {...common,id:`${prefix}.default-valid`,title:`${module.labelDe||module.id}: Standardwert ist registriert`,run:ctx=>{
    if(module.defaultValue===undefined)return false;
    return ctx.optionRegistry.list().some(option=>option.moduleId===module.id&&option.value===module.defaultValue);
   }}
  );

}
function runRegistryTestsLegacyFoundation(context=createRegistryTestContext()){
 const definitions=[...TEST_REGISTRY.list(),...generateAutomaticModuleTests()]
  .filter(test=>(test.lifecycle||'active')!=='retired');
 const seen=new Set(),results=[];
 for(const definition of definitions){
  if(seen.has(definition.id)){
   results.push(registryTestResult(definition,false,`Doppelte Test-ID: ${definition.id}`));
   continue;
  }
  seen.add(definition.id);
  try{
   if(typeof definition.run!=='function')throw new Error('Testfunktion run fehlt.');
   const outcome=definition.run(context);
   const ok=typeof outcome==='object'&&outcome!==null&&'ok' in outcome?outcome.ok:outcome!==false;
   const details=typeof outcome==='object'&&outcome!==null?outcome.details||'':'';
   results.push(registryTestResult(definition,ok,ok?'':(outcome?.error||'Testbedingung wurde nicht erfüllt.'),details));
  }catch(error){results.push(registryTestResult(definition,false,error?.message||String(error)));}
 }
 const failed=results.filter(result=>!result.ok);
 const warnings=failed.filter(result=>result.severity==='warn').length;
 const errors=failed.filter(result=>result.severity==='error').length;
 return {frameworkVersion:REGISTRY_TEST_FRAMEWORK_VERSION,moduleTestVersion:AUTOMATIC_MODULE_TEST_VERSION,total:results.length,passed:results.length-failed.length,failed,warnings,errors,results};
}
function registryFoundationReport(){

 return {version:REGISTRY_FOUNDATION_VERSION,ok:issues.length===0,issues,reports};
}

function stableOptionId(field,value){
 const normalized=String(value??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
  .replace(/&/g,' and ').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
 let hash=2166136261;for(const ch of String(value??'')){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619);}
 return `${field}.${normalized||'empty'}.${(hash>>>0).toString(36)}`;
}
function buildNeutralCatalog(){
 const catalog={};
 for(const [field,getValues] of Object.entries(NEUTRAL_FIELD_SOURCES)){
  const values=[...new Set((getValues()||[]).map(v=>String(v)))];
  catalog[field]=values.map(value=>({id:stableOptionId(field,value),labels:{de:value,en:value},legacyValues:[value]}));
 }
 return catalog;
}
const NEUTRAL_CATALOG=buildNeutralCatalog();
function neutralOption(field,value){
 const source=String(value??'');
 const options=NEUTRAL_CATALOG[field]||[];
 return options.find(o=>o.legacyValues.includes(source)||o.id===source)||{
  id:stableOptionId(field,source),labels:{de:source,en:source},legacyValues:[source],custom:true
 };
}
function neutralSelection(field,value){const option=neutralOption(field,value);return {id:option.id,labelDe:option.labels.de,labelEn:option.labels.en,custom:Boolean(option.custom)};}
function buildNeutralSelections(data){
 const selections={};
 for(const field of Object.keys(NEUTRAL_FIELD_SOURCES))selections[field]=neutralSelection(field,data?.[field]);
 for(const key of GARMENT_KEYS){
  selections[key+'Brand']={id:stableOptionId(key+'Brand',data?.[key+'Brand']),labelDe:String(data?.[key+'Brand']||''),labelEn:String(data?.[key+'Brand']||''),custom:data?.[key+'Brand']==='Benutzerdefiniert'};
 }
 return selections;
}
function migrateNeutralSelections(data){
 data.selectionIds=data.selectionIds&&typeof data.selectionIds==='object'?data.selectionIds:{};
 const selections=buildNeutralSelections(data);
 for(const [field,selection] of Object.entries(selections))data.selectionIds[field]=selection.id;
 data.schemaVersion=DATA_SCHEMA_VERSION;
 return data;
}
function neutralCatalogCoverage(){
 const fields=Object.keys(NEUTRAL_FIELD_SOURCES);const entries=fields.reduce((n,k)=>n+(NEUTRAL_CATALOG[k]?.length||0),0);

function clean(value,fallback=''){return String(value??fallback).trim().replace(/\s+/g,' ').replace(/\.{2,}/g,'.').replace(/\s+([,.;:])/g,'$1');}

function garmentDisplay(g){return [g.item,g.color&&`in ${g.color}`,g.brand&&`von ${g.brand}`,g.model&&`Modell ${g.model}`,g.transparency&&`mit ${g.transparency}`].filter(Boolean).join(' ');}
function buildVisibleOutfit(x){return buildGarmentData(x).map(garmentDisplay);}
function activeFeatures(x,group){const source=x.featureSelections?.[group]||{};return Object.entries(source).filter(([,v])=>v&&v.enabled).map(([id,v])=>({id,...v}));}
function hairFeaturePrompt(features){const labels={organization:'Haarorganisation',volume:'Haarvolumen',flyaways:'Einzelne abstehende Haare',babyHairs:'Feine Haare am Haaransatz',frizz:'Natürliche Kräuselung',movement:'Haarbewegung'};return features.map(f=>`${labels[f.id]||f.id}: ${f.intensity||'Natürlich'}`);}

const FEATURE_LABELS={makeup:{base:'Teint und Base',eyes:'Augen-Make-up',brows:'Augenbrauen',blush:'Rouge',lips:'Lippen'},clothingDetails:{fit:'Passform',condition:'Kleidungszustand',layering:'Schichtung',movement:'Stoffbewegung'},cameraFeatures:{angle:'Kamerawinkel',distance:'Aufnahmedistanz',depth:'Tiefenschärfe',stabilization:'Aufnahmegefühl'},lightFeatures:{quality:'Lichtcharakter',direction:'Lichtrichtung',intensity:'Lichtintensität',contrast:'Lichtkontrast',practicals:'Zusatzlichter',shadow:'Schattencharakter'},weather:{condition:'Wetterlage',wind:'Wind',air:'Luftwirkung'},moodFeatures:{emotion:'Grundgefühl',energy:'Energie',colorMood:'Farbwirkung',narrative:'Momentcharakter'}};

const FEATURE_PRIORITY={organization:100,volume:90,movement:75,frizz:55,flyaways:45,babyHairs:35};
function normalizeIntensity(value){return clean(value,'Natürlich').toLocaleLowerCase('de-DE');}
function rankHairFeatures(features){return [...features].sort((a,b)=>(FEATURE_PRIORITY[b.id]||0)-(FEATURE_PRIORITY[a.id]||0));}
function resolveHairFeatureConflicts(features){
 const resolved=rankHairFeatures(features).map(f=>({...f}));
 const byId=Object.fromEntries(resolved.map(f=>[f.id,f]));
 const organization=normalizeIntensity(byId.organization?.intensity);
 const movement=normalizeIntensity(byId.movement?.intensity);
 if(/perfekt|streng|glatt/.test(organization)){
  if(byId.flyaways&&/sehr viele|stark|deutlich/.test(normalizeIntensity(byId.flyaways.intensity)))byId.flyaways.intensity='Wenige';
  if(byId.frizz&&!/kein|gering/.test(normalizeIntensity(byId.frizz.intensity)))byId.frizz.intensity='Gering';
 }
 if(/stark|dynamisch|windig/.test(movement)&&byId.organization&&/perfekt|streng/.test(organization))byId.organization.intensity='Gepflegt';
 return resolved;
}
function featureById(features,id){return (features||[]).find(f=>f.id===id);}
function setFeatureIntensity(features,id,value){const f=featureById(features,id);if(f)f.intensity=value;else features.push({id,enabled:true,intensity:value});}

function sceneAreaText(pd){return `${pd.environment.location} ${pd.environment.area}`.toLocaleLowerCase('de-DE');}

 if(/strand|terrasse|balkon/.test(area))return {condition:'Sonnig',wind:'Leichte Brise',air:'Warm'};
 if(/stadtstraße|seitenstraße/.test(area))return {condition:'Trocken und mild',wind:'Leichte Brise',air:'Klar'};
 if(/café|restaurant|hotel|wohnung|studio|bad|küche|schlafzimmer/.test(area))return {condition:'Trocken und mild',wind:'Windstill',air:'Klar'};

}
function automaticMood(pd,weather){

 let emotion='Ruhig',energy='Ausgeglichen',colorMood='Natürlich neutral',narrative='Alltäglich';

 if(/strand|terrasse|balkon/.test(area)){emotion='Warm';colorMood='Sommerlich';narrative='Reise-Moment';}
 if(/stadtstraße|seitenstraße/.test(area)){emotion='Spontan';narrative='Urban';}
 if(/hotel|restaurant/.test(area)){emotion='Elegant';narrative='Editorial';}
 if(/candid|snapshot|raw smartphone/.test(style)){emotion='Spontan';narrative='Unbeobachtet';}
 if(/Bewölkt|Neblig|Regen/.test(weather.condition)){colorMood='Gedämpft';if(energy==='Dynamisch')energy='Ausgeglichen';}

function automaticWet(weather,location){

function automaticLightSource(pd,weather){

function resolveLightSystem(pd){

function dedupeAdjacentWords(text){

}
function refinePromptText(text){

  .replace(/material passend zur (?:Jackenart|Schuhmodell)/gi,'geeignetem, realistischem Material')
  .replace(/\bRaw Smartphone\.\s+Raw Smartphone\./gi,'Raw Smartphone.')
  .replace(/\s+\./g,'.').replace(/\.{2,}/g,'.')

function stableSerialize(value,stack=new WeakSet()){
 if(value===undefined)return 'undefined';
 if(value===null)return 'null';
 const type=typeof value;
 if(type==='string'||type==='boolean'||type==='number')return JSON.stringify(value);
 if(type==='function'||type==='symbol'||type==='bigint')throw new TypeError('Nicht unterstützter Cache-Wert: '+type);
 if(type!=='object')return JSON.stringify(value);
 if(stack.has(value))throw new TypeError('Zyklische Projektdaten können nicht als Cache-Key serialisiert werden.');
 if(!Array.isArray(value)&&Object.prototype.toString.call(value)!=='[object Object]')throw new TypeError('Nur normale JSON-Projektobjekte können als Cache-Key serialisiert werden.');
 stack.add(value);
 try{
  if(Array.isArray(value))return `[${value.map(item=>stableSerialize(item,stack)).join(',')}]`;
  return `{${Object.keys(value).sort().map(key=>`${JSON.stringify(key)}:${stableSerialize(value[key],stack)}`).join(',')}}`;
 }finally{stack.delete(value);}
}

function qualityGateGermanResidue(text,language){
 if(language!=='en')return [];
 const hits=[];

  const t=line.trim();if(!t)return;
  const umlaut=t.match(/[äöüß]/i);
